name: Daily Pan Eye Review

on:
  workflow_dispatch:
  schedule:
    # 17:00 Asia/Shanghai, Monday to Friday
    - cron: "0 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-pan-eye-review
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install lxml

      - name: Check AI configuration
        id: ai-config
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ vars.AI_API_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          if [ -z "$AI_API_KEY" ] || [ -z "$AI_API_URL" ] || [ -z "$AI_MODEL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "AI credentials are not configured; the current public site remains unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build daily review
        if: steps.ai-config.outputs.ready == 'true'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ vars.AI_API_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          TRIAL_DATE=$(TZ=Asia/Shanghai date +%F)
          python scripts/update_daily.py \
            --date "$TRIAL_DATE" \
            --wait-retries 5 \
            --wait-seconds 300

      - name: Persist review data and archive
        if: steps.ai-config.outputs.ready == 'true'
        run: |
          git config user.name "pan-eye-bot"
          git config user.email "pan-eye-bot@users.noreply.github.com"
          git add data docs archive calendar-data.js review-data.js market-data.js history-data.js screen-data.js sector-data.js
          if ! git diff --cached --quiet; then
            git commit -m "data: add daily review $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
