name: Daily Pan Eye Review

on:
  workflow_dispatch:
  schedule:
    # 17:00 Asia/Shanghai, Monday to Friday
    - cron: "0 9 * * 1-5"

permissions:
  contents: write
  models: read

concurrency:
  group: daily-pan-eye-review
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY || github.token }}
      AI_API_URL: ${{ vars.AI_API_URL || 'https://models.github.ai/inference' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4.1-mini' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install lxml

      - name: Build daily review
        run: |
          TRIAL_DATE=$(TZ=Asia/Shanghai date +%F)
          python scripts/update_daily.py \
            --date "$TRIAL_DATE" \
            --wait-retries 5 \
            --wait-seconds 300

      - name: Persist review data and archive
        run: |
          git config user.name "pan-eye-bot"
          git config user.email "pan-eye-bot@users.noreply.github.com"
          git add data docs archive calendar-data.js review-data.js market-data.js history-data.js screen-data.js sector-data.js
          if ! git diff --cached --quiet; then
            git commit -m "data: add daily review $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
