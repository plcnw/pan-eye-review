name: Daily Pan Eye Review

on:
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: "刷新范围"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - article
          - market
      review_date:
        description: "日期 YYYY-MM-DD；留空使用上海时区当天"
        required: false
        default: ""
        type: string
  schedule:
    # 17:35 and 18:20 Asia/Shanghai, Monday to Friday.
    # Cloudflare is the 17:05 primary trigger; these are delayed backups.
    - cron: "35 9 * * 1-5"
    - cron: "20 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-pan-eye-review
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use current main after queued runs
        run: |
          git fetch origin main
          git switch --force-create main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install lxml

      - name: Check AI configuration
        id: ai-config
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ vars.AI_API_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          if [ -z "$AI_API_KEY" ] || [ -z "$AI_API_URL" ] || [ -z "$AI_MODEL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "AI credentials are not configured; the current public site remains unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve review date
        id: review-date
        run: |
          TRIAL_DATE="${{ inputs.review_date }}"
          if [ -z "$TRIAL_DATE" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              # Scheduled runs can start hours late. The UTC date remains stable
              # even when Beijing time has already crossed midnight.
              TRIAL_DATE=$(date -u +%F)
            else
              TRIAL_DATE=$(TZ=Asia/Shanghai date +%F)
            fi
          fi
          echo "date=$TRIAL_DATE" >> "$GITHUB_OUTPUT"
          echo "Target review date: $TRIAL_DATE" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether this scheduled run is still needed
        id: refresh-guard
        run: |
          TRIAL_DATE="${{ steps.review-date.outputs.date }}"
          SHOULD_RUN=true
          if [ "${{ github.event_name }}" = "schedule" ] \
            && [ -f "data/review/$TRIAL_DATE.json" ]; then
            SHOULD_RUN=false
            echo "$TRIAL_DATE 已由主调度生成，本次备份任务跳过。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - name: Build daily review
        if: steps.ai-config.outputs.ready == 'true' && steps.refresh-guard.outputs.should_run == 'true'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ vars.AI_API_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          REFRESH_SCOPE="${{ inputs.refresh_scope || 'all' }}"
          python scripts/update_daily.py \
            --date "${{ steps.review-date.outputs.date }}" \
            --scope "$REFRESH_SCOPE" \
            --wait-retries 5 \
            --wait-seconds 300

      - name: Persist review data and archive
        if: steps.ai-config.outputs.ready == 'true' && steps.refresh-guard.outputs.should_run == 'true'
        run: |
          TRIAL_DATE="${{ steps.review-date.outputs.date }}"
          git config user.name "pan-eye-bot"
          git config user.email "pan-eye-bot@users.noreply.github.com"
          git add data docs archive calendar-data.js review-data.js market-data.js history-data.js screen-data.js sector-data.js refresh-config.js
          if ! git diff --cached --quiet; then
            git commit -m "data: add daily review $TRIAL_DATE"
            git push
          fi

