name: Bootstrap Pan Eye Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack project archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -o pan-eye-source.zip -d staging
          cp -a staging/. .
          rm -rf staging pan-eye-source.zip
          rm -f .github/workflows/bootstrap.yml
          git config user.name "pan-eye-bot"
          git config user.email "pan-eye-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize Pan Eye app"
          git push
