name: Apply AI resilience

on:
  push:
    paths:
      - .github/workflows/apply-ai-resilience.yml

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use latest main
        run: |
          git fetch origin main
          git switch --force-create main origin/main

      - name: Apply resilient AI parsing bundle
        run: |
          base64 -d > /tmp/pan-eye-ai-resilience.tar.gz <<'BUNDLE'
          
          BUNDLE
          tar -xzf /tmp/pan-eye-ai-resilience.tar.gz -C .
          base64 -d > .github/workflows/daily-review.yml <<'WORKFLOW'
          
          WORKFLOW

      - name: Validate Python
        run: python -m py_compile scripts/ai_structure.py

      - name: Commit AI resilience fix
        run: |
          git config user.name "pan-eye-bot"
          git config user.email "pan-eye-bot@users.noreply.github.com"
          git add scripts/ai_structure.py .github/workflows/daily-review.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix: retry truncated AI review output"
            git push
          fi

      - name: Trigger 2026-11-02 rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run daily-review.yml \
            --ref main \
            -f refresh_scope=all \
            -f review_date=2026-11-02
