name: Apply final archive calendar fix

on:
  push:
    paths:
      - .github/workflows/apply-calendar-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use latest main
        run: |
          git fetch origin main
          git switch --force-create main origin/main

      - name: Apply final calendar bundle
        run: |
          base64 -d > /tmp/pan-eye-calendar-final.tar.gz <<'BUNDLE'
          
          BUNDLE
          tar -xzf /tmp/pan-eye-calendar-final.tar.gz -C .

      - name: Validate and rebuild historical calendars
        run: |
          python -m py_compile scripts/build_standalone.py
          LATEST_DATE=$(find data/review -name '*.json' -printf '%f\n' | sort | tail -1 | sed 's/\.json$//')
          python scripts/build_standalone.py --date "$LATEST_DATE"

      - name: Commit final calendar fix
        run: |
          git config user.name "pan-eye-bot"
          git config user.email "pan-eye-bot@users.noreply.github.com"
          git add scripts/build_standalone.py index.html calendar-data.js archive docs
          if ! git diff --cached --quiet; then
            git commit -m "fix: unify archive navigation and remove loading flash"
            git push
          fi
