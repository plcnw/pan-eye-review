name: Apply opportunities verification flow

on:
  push:
    paths:
      - .github/workflows/apply-opportunities-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use latest main
        run: |
          git fetch origin main
          git switch --force-create main origin/main

      - name: Apply opportunities bundle
        run: |
          base64 -d > /tmp/pan-eye-opportunities-apply.tar.gz <<'BUNDLE'
          
          BUNDLE
          tar -xzf /tmp/pan-eye-opportunities-apply.tar.gz -C .

      - name: Validate source
        run: |
          node --check app-daily.js
          node --check opportunities.js
          python -m py_compile scripts/build_standalone.py

      - name: Rebuild published site
        run: |
          LATEST_DATE=$(find data/review -name '*.json' -printf '%f\n' | sort | tail -1 | sed 's/\.json$//')
          python scripts/build_standalone.py --date "$LATEST_DATE"

      - name: Commit opportunities module
        run: |
          git config user.name "pan-eye-bot"
          git config user.email "pan-eye-bot@users.noreply.github.com"
          git add index.html app-daily.js opportunities.css opportunities.js scripts/build_standalone.py calendar-data.js archive docs
          if ! git diff --cached --quiet; then
            git commit -m "feat: add trading opportunity analysis workspace"
            git push
          fi
