name: Apply archive calendar refresh

on:
  push:
    paths:
      - .github/workflows/apply-calendar-archive.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use latest main
        run: |
          git fetch origin main
          git switch --force-create main origin/main

      - name: Apply archive calendar bundle
        run: |
          base64 -d > /tmp/pan-eye-calendar-archive.tar.gz <<'BUNDLE'
          
          BUNDLE
          tar -xzf /tmp/pan-eye-calendar-archive.tar.gz -C .
          base64 -d > scripts/build_standalone.py <<'SCRIPT_V2'
          
          SCRIPT_V2
          base64 -d > scripts/build_standalone.py <<'SCRIPT_V3'
          
          SCRIPT_V3
          base64 -d > scripts/build_standalone.py <<'SCRIPT_V4'
          
          SCRIPT_V4

      - name: Validate calendar fix
        run: |
          python -m py_compile scripts/build_standalone.py
          LATEST_DATE=$(find data/review -name '*.json' -printf '%f\n' | sort | tail -1 | sed 's/\.json$//')
          python scripts/build_standalone.py --date "$LATEST_DATE"

      - name: Commit refreshed historical calendars
        run: |
          git config user.name "pan-eye-bot"
          git config user.email "pan-eye-bot@users.noreply.github.com"
          git add scripts/build_standalone.py calendar-data.js archive docs
          if ! git diff --cached --quiet; then
            git commit -m "fix: refresh calendar links in historical reviews"
            git push
          fi
